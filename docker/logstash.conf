# Task 2.4 & 3.2 - Cấu hình Pipeline bóc tách Log bằng Grok (Võ Quang Minh Tuấn)
input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Bóc tách log đăng nhập SSH (Thất bại & Thành công)
  if "sshd" in [message] {
    grok {
      match => {
        "message" => [
          "(?:%{SYSLOGTIMESTAMP:timestamp}|%{TIMESTAMP_ISO8601:timestamp}) %{HOSTNAME:target_host} sshd\[%{NUMBER:pid}\]: Failed password for (invalid user )?%{USERNAME:user} from %{IP:src_ip} port %{NUMBER:src_port} ssh2",
          "(?:%{SYSLOGTIMESTAMP:timestamp}|%{TIMESTAMP_ISO8601:timestamp}) %{HOSTNAME:target_host} sshd\[%{NUMBER:pid}\]: Accepted password for %{USERNAME:user} from %{IP:src_ip} port %{NUMBER:src_port} ssh2"
        ]
      }
    }

    if "Failed password" in [message] {
      mutate {
        add_field => {
          "ssh_event" => "SSH_LOGIN_FAILED"
          "event_category" => "brute_force"
        }
      }
    } else if "Accepted password" in [message] {
      mutate {
        add_field => {
          "ssh_event" => "SSH_LOGIN_SUCCESS"
          "event_category" => "authentication"
        }
      }
    }
  }

  # 2. Bóc tách log leo thang đặc quyền (Sudo / Đọc file /etc/shadow)
  if "sudo:" in [message] or "/etc/shadow" in [message] {
    grok {
      match => {
        "message" => "(?:%{SYSLOGTIMESTAMP:timestamp}|%{TIMESTAMP_ISO8601:timestamp}) %{HOSTNAME:target_host} sudo: +%{USERNAME:user} : TTY=%{DATA:tty} ; PWD=%{DATA:pwd} ; USER=%{USERNAME:target_user} ; COMMAND=%{GREEDYDATA:command}"
      }
    }
    mutate {
      add_field => {
        "ssh_event" => "PRIVILEGE_ESCALATION"
        "event_category" => "privilege_abuse"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-logs-%{+YYYY.MM.dd}"
    data_stream => "false"
  }
  stdout { codec => rubydebug }
}
